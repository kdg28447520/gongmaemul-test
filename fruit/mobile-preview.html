<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>과일 관제탑 모바일 화면 확인용 (임시)</title>
<style>
  body { margin: 0; background: #d8d8d4; font: 12px/1.4 -apple-system, sans-serif; }
  .phone { width: 390px; margin: 12px auto; background: #fff; box-shadow: 0 2px 18px rgba(0,0,0,.18); }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  .cap { width: 390px; margin: 0 auto; padding: 6px 2px; color: #444; }
</style>
</head>
<body>
<div class="cap" id="cap">모바일 390px</div>
<div class="phone"><iframe id="f" src="./index.html"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const tab = q.get('tab') || '';
  const y = Number(q.get('y') || 0);
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    try {
      if (tab) f.contentWindow.location.hash = '#' + tab;
      setTimeout(() => f.contentWindow.scrollTo(0, y), 700);
    } catch (e) {}
  });
  f.src = './index.html' + (tab ? '?v=' + Date.now() + '#' + tab : '?v=' + Date.now());
  document.getElementById('cap').textContent = '모바일 390px · ' + (tab || '도매 최저가') + ' · y=' + y;
</script>
</body>
</html>
