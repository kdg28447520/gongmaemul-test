<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReviewPilot — 실시간 체험단</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFFFF;
      color: #222222;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-white text-[#222222] pb-16">

  <!-- 상단 고정 헤더 & 검색바 -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#EBEBEB]">
    <div class="max-w-6xl mx-auto px-3.5 sm:px-6 pt-3 pb-2.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-full bg-[#FF385C] text-white flex items-center justify-center">
            <i class="fa-solid fa-compass text-xs"></i>
          </div>
          <span class="font-bold text-base sm:text-lg tracking-tight text-[#FF385C]">ReviewPilot</span>
        </div>
        <div class="flex items-center space-x-1.5 text-[11px] text-[#717171]">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>실시간 2026-11-22 14:49 기준</span>
        </div>
      </div>

      <!-- 에어비앤비 알약형 검색바 -->
      <div class="flex items-center bg-white border border-[#DDDDDD] rounded-full shadow-[0_2px_10px_rgba(0,0,0,0.06)] pl-4 pr-1.5 py-1.5">
        <i class="fa-solid fa-magnifying-glass text-[#222222] text-xs mr-2.5"></i>
        <input
          id="searchInput"
          type="text"
          oninput="resetPageAndFilter()"
          placeholder="상품명, 지역, 릴스/블로그 검색"
          class="w-full text-[13px] bg-transparent outline-none text-[#222222] placeholder-[#717171]"
        />
        <button onclick="resetAll()" title="초기화" class="shrink-0 ml-2 w-7 h-7 rounded-full bg-[#FF385C] text-white flex items-center justify-center">
          <i class="fa-solid fa-rotate-right text-[11px]"></i>
        </button>
      </div>
    </div>

    <!-- 가로 카테고리 탭 -->
    <div class="max-w-6xl mx-auto px-3.5 sm:px-6 flex items-center space-x-5 overflow-x-auto no-scrollbar border-t border-[#F3F3F3]">
      <button onclick="selectTab('all', this)" class="cat-tab shrink-0 py-2.5 flex flex-col items-center space-y-1 border-b-2 border-[#222222] text-[#222222]">
        <i class="fa-solid fa-border-all text-sm"></i>
        <span class="text-[11px] font-semibold">전체</span>
      </button>
      <button onclick="selectTab('shortage', this)" class="cat-tab shrink-0 py-2.5 flex flex-col items-center space-y-1 border-b-2 border-transparent text-[#717171]">
        <i class="fa-solid fa-bolt text-sm"></i>
        <span class="text-[11px] font-semibold">미달 우선</span>
      </button>
      <button onclick="selectTab('배송', this)" class="cat-tab shrink-0 py-2.5 flex flex-col items-center space-y-1 border-b-2 border-transparent text-[#717171]">
        <i class="fa-solid fa-box-open text-sm"></i>
        <span class="text-[11px] font-semibold">배송형</span>
      </button>
      <button onclick="selectTab('맛집', this)" class="cat-tab shrink-0 py-2.5 flex flex-col items-center space-y-1 border-b-2 border-transparent text-[#717171]">
        <i class="fa-solid fa-utensils text-sm"></i>
        <span class="text-[11px] font-semibold">맛집·카페</span>
      </button>
      <button onclick="selectTab('뷰티', this)" class="cat-tab shrink-0 py-2.5 flex flex-col items-center space-y-1 border-b-2 border-transparent text-[#717171]">
        <i class="fa-solid fa-sparkles text-sm"></i>
        <span class="text-[11px] font-semibold">뷰티</span>
      </button>
      <button onclick="selectTab('릴스', this)" class="cat-tab shrink-0 py-2.5 flex flex-col items-center space-y-1 border-b-2 border-transparent text-[#717171]">
        <i class="fa-solid fa-film text-sm"></i>
        <span class="text-[11px] font-semibold">릴스·클립</span>
      </button>
    </div>
  </header>

  <!-- 메인 2~4열 카드 그리드 -->
  <main class="max-w-6xl mx-auto px-3.5 sm:px-6 pt-4 space-y-6">
    <div class="flex items-center justify-between">
      <p id="summaryText" class="text-xs sm:text-sm font-semibold text-[#222222]"></p>
      <span class="text-[11px] text-[#717171]">경쟁률 낮은 순</span>
    </div>

    <div id="cardGrid" class="grid grid-cols-2 md:grid-cols-4 gap-x-3 gap-y-5 sm:gap-x-5 sm:gap-y-7"></div>

    <!-- 20개 페이징 -->
    <div id="pagination" class="flex items-center justify-center space-x-2 pt-4"></div>
  </main>

  <!-- 화이트 신청 모달 -->
  <div id="applyModal" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-[2px] flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl border border-[#EBEBEB] space-y-3.5">
      <div class="flex items-center justify-between pb-2.5 border-b border-[#EBEBEB]">
        <span id="modalMeta" class="text-xs font-semibold text-[#FF385C]"></span>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-[#F7F7F7] flex items-center justify-center text-[#222222]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <h3 id="modalTitle" class="font-bold text-sm sm:text-base text-[#222222] leading-snug"></h3>
      <div class="grid grid-cols-2 gap-2 bg-[#F7F7F7] p-3 rounded-xl border border-[#EBEBEB] text-xs">
        <div>
          <span class="text-[#717171] block text-[11px]">수령인</span>
          <span class="font-semibold">김동곤 (010-4982-2844)</span>
        </div>
        <div>
          <span class="text-[#717171] block text-[11px]">배송지</span>
          <span class="font-semibold truncate block"></span>
        </div>
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold">신청 한마디</span>
          <button onclick="copyAppeal()" class="text-xs font-semibold text-[#FF385C]">복사</button>
        </div>
        <textarea id="modalAppeal" rows="3" class="w-full p-2.5 border border-[#DDDDDD] rounded-xl text-xs leading-relaxed outline-none"></textarea>
      </div>

    </div>
  </div>

    const PAGE_SIZE = 20;
    let activeTab = 'all';
    let currentPage = 1;
    const liked = new Set();

    function selectTab(tab, el) {
      activeTab = tab;
      currentPage = 1;
      document.querySelectorAll('.cat-tab').forEach(b => {
        b.classList.remove('border-[#222222]', 'text-[#222222]');
        b.classList.add('border-transparent', 'text-[#717171]');
      });
      el.classList.remove('border-transparent', 'text-[#717171]');
      el.classList.add('border-[#222222]', 'text-[#222222]');
      render();
    }

    function resetPageAndFilter() {
      currentPage = 1;
      render();
    }

    function resetAll() {
      document.getElementById('searchInput').value = '';
      selectTab('all', document.querySelector('.cat-tab'));
    }

    function toggleLike(id, btn) {
      if (liked.has(id)) {
        liked.delete(id);
        btn.innerHTML = '<i class="fa-regular fa-heart text-white drop-shadow text-base"></i>';
      } else {
        liked.add(id);
        btn.innerHTML = '<i class="fa-solid fa-heart text-[#FF385C] drop-shadow text-base"></i>';
      }
    }

    function getFiltered() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return ITEMS.filter(item => {
        let matchTab = true;
        if (activeTab === 'shortage') matchTab = item.shortage > 0;
        else if (activeTab === '릴스') matchTab = item.channel === '릴스' || item.channel === '클립';
        else if (activeTab !== 'all') matchTab = item.category.includes(activeTab);

        const matchQ = !q || item.title.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.channel.toLowerCase().includes(q);
        return matchTab && matchQ;
      });
    }

    function render() {
      const list = getFiltered();
      const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const slice = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
      const shortageCnt = list.filter(x => x.shortage > 0).length;
      document.getElementById('summaryText').innerText = `실시간 공고 ${list.length}건 (미달 ${shortageCnt}건)`;

      const grid = document.getElementById('cardGrid');
      if (slice.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-14 text-center text-xs text-[#717171]">조건에 맞는 실시간 공고가 없습니다.</div>`;
      } else {
        grid.innerHTML = slice.map(item => {
          const badge = item.shortage > 0
            ? `<span class="w-1.5 h-1.5 rounded-full bg-[#FF385C]"></span><span>${item.shortage}명 미달</span>`
            : `<span>${item.dday}</span>`;
          return `
            <article class="flex flex-col cursor-pointer" onclick="openModal('${item.id}')">
              <div class="relative aspect-square rounded-2xl overflow-hidden bg-[#F7F7F7] border border-[#EBEBEB] mb-2">
                <img src="${item.img}" alt="${item.title}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition duration-300" />
                <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-white/95 text-[#222222] text-[10px] font-bold shadow-sm flex items-center space-x-1">
                  ${badge}
                </span>
                <button onclick="event.stopPropagation(); toggleLike('${item.id}', this)" class="absolute top-2 right-2 w-7 h-7 flex items-center justify-center rounded-full">
                  <i class="${liked.has(item.id) ? 'fa-solid text-[#FF385C]' : 'fa-regular text-white'} fa-heart drop-shadow text-base"></i>
                </button>
              </div>
              <div class="space-y-0.5">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="font-semibold text-[#222222] truncate">${item.category} · ${item.channel}</span>
                  <span class="shrink-0 font-medium text-[#222222] ml-1">${item.applied}/${item.target}명</span>
                </div>
                <h3 class="text-[12.5px] sm:text-[13px] font-medium text-[#222222] line-clamp-2 leading-snug">
                  ${item.title}
                </h3>
                <p class="text-[11px] text-[#717171] pt-0.5">${item.source} · 경쟁률 ${item.rate}%</p>
              </div>
            </article>
          `;
        }).join('');
      }

      const pag = document.getElementById('pagination');
      if (totalPages <= 1) {
        pag.innerHTML = '';
      } else {
        pag.innerHTML = Array.from({length: totalPages}, (_, i) => i + 1).map(p => `
          <button onclick="currentPage=${p}; render(); window.scrollTo({top:0, behavior:'smooth'});"
            class="w-8 h-8 rounded-full text-xs font-semibold transition ${p === currentPage ? 'bg-[#222222] text-white' : 'bg-[#F7F7F7] text-[#222222] hover:bg-[#EBEBEB]'}">
            ${p}
          </button>
        `).join('');
      }
    }

    function openModal(id) {
      const item = ITEMS.find(x => x.id === id);
      if (!item) return;
      document.getElementById('modalMeta').innerText = `${item.source} · ${item.category} · ${item.applied}/${item.target}명 (${item.dday})`;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalAppeal').value = `[${item.channel} 체험 신청] 제품 특징과 실사용 모습을 깔끔한 사진/영상으로 정성껏 리뷰하겠습니다.`;
      document.getElementById('modalLink').href = item.url;
      document.getElementById('applyModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('applyModal').classList.add('hidden');
    }

    function copyAppeal() {
      navigator.clipboard.writeText(document.getElementById('modalAppeal').value);
      alert('신청 문구가 복사되었습니다.');
    }

    window.onload = render;
  </script>
