<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>동곤 마이링크 PRO — 쇼츠·릴스 번호형 꿀템 링크트리</title>
  <meta name="description" content="쇼츠·릴스 영상 속 추천 아이템을 번호로 1초 만에 찾아 쿠팡 최저가로 직결하는 프리미엄 크리에이터 링크트리">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #090a0f;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.2);
    }
    .number-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .coupang-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      transition: all 0.2s;
    }
    .coupang-btn:hover {
      filter: brightness(1.1);
      transform: scale(0.98);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-20 selection:bg-indigo-500 selection:text-white">

  <!-- Background Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-[120px]"></div>
  </div>

  <div class="relative z-10 max-w-md mx-auto px-4 pt-8">

    <!-- Profile Header -->
    <header class="text-center mb-6">
      <div class="relative inline-block mb-3">
        <div class="w-20 h-20 rounded-full p-1 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 shadow-xl shadow-indigo-500/20">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Profile" class="w-full h-full rounded-full object-cover">
        </div>
        <span class="absolute bottom-0 right-0 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
      </div>
      <h1 class="text-xl font-bold flex items-center justify-center gap-1.5">
        동곤의 꿀템 연구소
        <svg class="w-4 h-4 text-indigo-400 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
      </h1>
      <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto leading-relaxed">
        영상 속 번호(#)를 검색하시면 해당 제품의 쿠팡 최저가 링크로 바로 연결됩니다.
      </p>

      <!-- Social Links -->
      <div class="flex justify-center gap-2 mt-3">
        <a href="#" class="px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-[11px] font-medium text-slate-300 hover:text-white flex items-center gap-1">
          <span>🎬 유튜브</span>
        </a>
        <a href="#" class="px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-[11px] font-medium text-slate-300 hover:text-white flex items-center gap-1">
          <span>📸 인스타그램</span>
        </a>
        <button onclick="openAdminModal()" class="px-3 py-1 rounded-full bg-indigo-900/40 border border-indigo-700/60 text-[11px] font-medium text-indigo-300 hover:text-white flex items-center gap-1">
          <span>⚙️ 내 링크 관리</span>
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="relative mb-4">
      <input type="text" id="searchInput" placeholder="영상 속 번호(예: 84)나 상품명 검색..." 
        class="w-full py-3.5 pl-11 pr-4 bg-slate-900/90 border border-slate-800 rounded-2xl text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner">
      <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <button id="clearBtn" onclick="clearSearch()" class="hidden absolute right-3.5 top-3.5 text-xs text-slate-500 hover:text-slate-300 bg-slate-800 px-2 py-0.5 rounded-full">지우기</button>
    </div>

    <!-- Category Tabs -->
    <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-5 py-1">
      <button onclick="filterCategory('all')" class="cat-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shrink-0">전체</button>
      <button onclick="filterCategory('kitchen')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-white shrink-0">주방·생활</button>
      <button onclick="filterCategory('car')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-white shrink-0">차량용품</button>
      <button onclick="filterCategory('tech')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-white shrink-0">디지털·가전</button>
      <button onclick="filterCategory('health')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-white shrink-0">건강·뷰티</button>
    </div>

    <!-- Notice Card -->
    <div class="glass-card p-3 rounded-xl mb-4 flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="p-1.5 bg-indigo-500/10 text-indigo-400 rounded-lg">💡</span>
        <span>영상에 나온 번호 카드 누르면 최저가 직결!</span>
      </div>
      <span id="totalCount" class="font-mono font-bold text-indigo-400">총 6개</span>
    </div>

    <!-- Products Grid (2 Columns) -->
    <div id="productGrid" class="grid grid-cols-2 gap-3">
      <!-- Rendered via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden py-16 text-center">
      <div class="text-4xl mb-2">🔍</div>
      <p class="text-sm text-slate-400 font-medium">검색된 번호나 상품이 없습니다.</p>
      <p class="text-xs text-slate-500 mt-1">다른 번호나 키워드로 검색해 보세요.</p>
    </div>

    <!-- Footer Notice -->
    <footer class="mt-10 pt-6 border-t border-slate-800/80 text-center text-[11px] text-slate-500 space-y-1.5">
      <p>쿠팡 파트너스 활동의 일환으로 일정액의 수수료를 제공받을 수 있습니다.</p>
      <p class="font-mono text-slate-600">Powered by Donggon MyLink Safe PRO</p>
    </footer>

  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-card bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-white flex items-center gap-1.5">
          <span>⚙️</span> 새 번호 링크 등록
        </h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
      </div>

      <form id="addForm" onsubmit="handleAddItem(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1 font-medium">영상 번호 (#)</label>
          <input type="number" id="itemNumber" required placeholder="예: 84" class="w-full py-2 px-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">상품명</label>
          <input type="text" id="itemName" required placeholder="예: 스카트 THE 버블 수세미" class="w-full py-2 px-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">카테고리</label>
          <select id="itemCategory" class="w-full py-2 px-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            <option value="kitchen">주방·생활</option>
            <option value="car">차량용품</option>
            <option value="tech">디지털·가전</option>
            <option value="health">건강·뷰티</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">할인가 / 가격 표기</label>
          <input type="text" id="itemPrice" placeholder="예: 8,900원 (로켓배송)" class="w-full py-2 px-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">이미지 URL</label>
          <input type="url" id="itemImage" placeholder="https://..." class="w-full py-2 px-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">쿠팡 파트너스 직결 링크</label>
          <input type="url" id="itemLink" required placeholder="https://link.coupang.com/..." class="w-full py-2 px-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeAdminModal()" class="w-1/2 py-2 rounded-lg bg-slate-800 text-slate-300 font-medium hover:bg-slate-700">취소</button>
          <button type="submit" class="w-1/2 py-2 rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-500 shadow-lg shadow-indigo-600/30">추가하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const defaultItems = [
      {
        id: 1,
        number: 84,
        name: "코팅 안 벗겨지는 천연 루파 일회용 수세미 4P",
        category: "kitchen",
        price: "8,900원",
        badge: "쇼츠 1위",
        image: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?auto=format&fit=crop&w=400&q=80",
        link: "https://www.coupang.com",
        clicks: 342
      },
      {
        id: 2,
        number: 91,
        name: "스탠리 호환 대구경 풀메탈 2in1 차량용 컵홀더",
        category: "car",
        price: "14,800원",
        badge: "쿠팡 로켓",
        image: "https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=400&q=80",
        link: "https://www.coupang.com",
        clicks: 289
      },
      {
        id: 3,
        number: 102,
        name: "360도 회전 논슬립 차량용 대형 거치 트레이",
        category: "car",
        price: "12,900원",
        badge: "품절임박",
        image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=400&q=80",
        link: "https://www.coupang.com",
        clicks: 195
      },
      {
        id: 4,
        number: 115,
        name: "뿌리는 풋샴푸 발각질 쿨링 거품 스프레이 500ml",
        category: "health",
        price: "9,900원",
        badge: "SNS 화제",
        image: "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=400&q=80",
        link: "https://www.coupang.com",
        clicks: 412
      },
      {
        id: 5,
        number: 128,
        name: "자석 부착형 슬림 무선 미니 센서등 3P 세트",
        category: "tech",
        price: "11,500원",
        badge: "가성비갑",
        image: "https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=400&q=80",
        link: "https://www.coupang.com",
        clicks: 178
      },
      {
        id: 6,
        number: 142,
        name: "기름때 싹 지우는 고밀도 니트릴 요리장갑 100매",
        category: "kitchen",
        price: "7,400원",
        badge: "필수 살림템",
        image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=400&q=80",
        link: "https://www.coupang.com",
        clicks: 220
      }
    ];

    let items = JSON.parse(localStorage.getItem('donggon_mylink_items')) || defaultItems;
    let currentCategory = 'all';

    function renderItems(filterText = '') {
      const grid = document.getElementById('productGrid');
      const empty = document.getElementById('emptyState');
      grid.innerHTML = '';

      let filtered = items.filter(item => {
        const matchesCat = currentCategory === 'all' || item.category === currentCategory;
        const matchesQuery = filterText === '' || 
          item.number.toString().includes(filterText) || 
          item.name.toLowerCase().includes(filterText.toLowerCase());
        return matchesCat && matchesQuery;
      });

      filtered.sort((a, b) => b.number - a.number);
      document.getElementById('totalCount').innerText = `총 ${filtered.length}개`;

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl overflow-hidden flex flex-col justify-between group';
        card.innerHTML = `
          <div>
            <div class="relative aspect-square w-full overflow-hidden bg-slate-800">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
              <div class="absolute top-2 left-2 number-badge px-2.5 py-1 rounded-lg text-xs font-black text-white shadow-md flex items-center gap-1">
                <span class="text-[10px] opacity-80">NO.</span>${item.number}
              </div>
              ${item.badge ? `<div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full text-[10px] font-semibold text-amber-300 border border-amber-400/20">${item.badge}</div>` : ''}
            </div>
            <div class="p-3">
              <h2 class="text-xs font-semibold text-slate-200 line-clamp-2 leading-snug h-8 mb-1.5">${item.name}</h2>
              <div class="text-xs font-bold text-amber-400 font-mono">${item.price || '최저가 확인'}</div>
            </div>
          </div>
          <div class="p-3 pt-0">
            <a href="${item.link}" target="_blank" onclick="trackClick(${item.id})" class="coupang-btn w-full py-2.5 px-3 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-1.5 shadow-lg shadow-red-600/20">
              <span>쿠팡 바로가기</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function trackClick(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.clicks = (item.clicks || 0) + 1;
        localStorage.setItem('donggon_mylink_items', JSON.stringify(items));
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'active');
        btn.classList.add('bg-slate-900/80', 'text-slate-400');
      });
      event.target.classList.remove('bg-slate-900/80', 'text-slate-400');
      event.target.classList.add('bg-indigo-600', 'text-white', 'active');
      renderItems(document.getElementById('searchInput').value.trim());
    }

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderItems(query);
    });

    function clearSearch() {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      renderItems('');
    }

    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function handleAddItem(e) {
      e.preventDefault();
      const number = parseInt(document.getElementById('itemNumber').value);
      const name = document.getElementById('itemName').value;
      const category = document.getElementById('itemCategory').value;
      const price = document.getElementById('itemPrice').value || '최저가 확인';
      const image = document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1584992236310-6edddc08acff?auto=format&fit=crop&w=400&q=80';
      const link = document.getElementById('itemLink').value;

      const newItem = {
        id: Date.now(),
        number,
        name,
        category,
        price,
        image,
        link,
        clicks: 0
      };

      items.unshift(newItem);
      localStorage.setItem('donggon_mylink_items', JSON.stringify(items));
      renderItems();
      closeAdminModal();
      document.getElementById('addForm').reset();
    }

    renderItems();
  </script>
</body>
</html>
